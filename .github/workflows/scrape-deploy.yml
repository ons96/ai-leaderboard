name: Scrape and Deploy
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 requests
      - run: python3 scrape_artificial_analysis.py
      - run: python3 build_site.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update scraped data"
            # PUSH_TOKEN = admin PAT; branch protection enforce_admins:false -> admin bypass
            if [ -z "${{ secrets.PUSH_TOKEN }}" ]; then
              echo "::warning::PUSH_TOKEN secret not set; push to protected main will fail. Set admin PAT w/ repo scope."
            fi
            git push
          fi
