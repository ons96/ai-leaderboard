<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Provider Leaderboard - Perplexity & Anthropic Analysis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;background:#f8f9fa;color:#212529}
.header{background:#1a1a2e;color:#fff;padding:16px 24px;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:600}
.header .meta{font-size:11px;color:#adb5bd;margin-top:4px}
.controls{background:#fff;border-bottom:1px solid #dee2e6;padding:8px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:56px;z-index:99}
.controls input{padding:6px 10px;border:1px solid #ced4da;border-radius:4px;font-size:13px;width:260px}
.controls select{padding:6px 8px;border:1px solid #ced4da;border-radius:4px;font-size:13px}
.controls button{padding:6px 12px;border:1px solid #ced4da;border-radius:4px;background:#fff;cursor:pointer;font-size:13px}
.controls button.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.badges{display:flex;gap:8px}
.badge{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-perplexity{background:#8b5cf6;color:#fff}
.badge-aa{background:#06b6d4;color:#fff}
.badge-reasoning{background:#f59e0b;color:#fff}
.table-wrap{overflow:auto;max-height:calc(100vh - 110px)}
table{width:100%;border-collapse:collapse;white-space:nowrap}
thead th{background:#e9ecef;padding:6px 10px;text-align:right;font-weight:600;font-size:12px;border-bottom:2px solid #dee2e6;cursor:pointer;user-select:none;position:sticky;top:0;z-index:10}
thead th.asc::after{content:" ▼";font-size:10px}
thead th.desc::after{content:" ▲";font-size:10px}
thead th.text-col{text-align:left}
tbody td{padding:4px 10px;text-align:right;border-bottom:1px solid #f1f3f5;font-variant-numeric:tabular-nums}
tbody td.text-col{text-align:left}
tbody tr:hover{background:#e7f5ff}
.gp-identity{background:#e8f4f8}
.gp-pricing{background:#fff9db}
.gp-derived{background:#d3f9d8}
.gp-quality{background:#ffe8cc}
.gp-speed{background:#d0ebff}
.gp-model_meta{background:#f1f3f5}
.paging{padding:8px 24px;background:#fff;border-top:1px solid #dee2e6;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.paging button{padding:4px 10px;border:1px solid #ced4da;border-radius:4px;background:#fff;cursor:pointer}
.footer{text-align:center;padding:8px;font-size:11px;color:#868e96;background:#f1f3f5}
.footer a{color:#1a1a2e}
</style>
</head>
<body>
<div class="header">
<h1>AI Provider Leaderboard — Perplexity Pro Models & Intelligence/Speed Analysis</h1>
<div class="meta" id="meta-info">Loading...</div>
</div>
<div class="controls">
<input type="text" id="search" placeholder="Search provider, model, creator, tags...">
<select id="source-filter"><option value="all">All Sources</option><option value="Perplexity">🟣 Perplexity Pro</option><option value="ArtificialAnalysis">🔵 AA Host Models</option></select>
<select id="size-filter"><option value="">All sizes</option><option value="Small">Small</option><option value="Medium">Medium</option><option value="Large">Large</option><option value="X-Large">X-Large</option></select>
<select id="reason-filter"><option value="">All types</option><option value="yes">Reasoning only</option><option value="no">Non-reasoning</option></select>
<select id="sort-rank"><option value="">Quick Rank</option><option value="intel_resp">🧠 Best Intel / Resp T</option><option value="coding_resp">💻 Best Coding / Resp T</option><option value="intel_price_resp">💰 Best Intel / ($*Resp)</option><option value="coding_price_resp">💰 Best Coding / ($*Resp)</option></select>
<button id="btn-best-resp">Top Response Time 🚀</button>
<button id="btn-reset">Reset</button>
<div class="group-toggles" id="group-toggles"></div>
</div>
<div class="table-wrap">
<table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
</div>
<div class="paging" id="paging"></div>
<div class="footer">
<span class="badges"><span class="badge badge-perplexity">Perplexity</span><span class="badge badge-aa">AA Hosts</span><span class="badge badge-reasoning">Reasoning</span></span><br>
Data: Artificial Analysis + Perplexity Models | Updated: <span id="update-date">-</span>
</div>
<script src="data.js"></script>
<script>
const PS=100;
let filtered=[],sortCol=null,sortDir=1,hiddenGroups=new Set(),page=0;
const TXT_COLS=new Set(["host_name","model_name","base_model","model_creator_name","model_type"]);

function init(){
  const hasPP=typeof PERPLEXITY_DATA!=="undefined";
  const hasAA=typeof AA_DATA!=="undefined";
  let allData=[];
  if(hasPP) allData=allData.concat(PERPLEXITY_DATA);
  if(hasAA) allData=allData.concat(AA_DATA.slice(0,500));
  filtered=allData.map(r=>({...r}));

  if(!hasPP && !hasAA){
    document.getElementById("meta-info").textContent="No data available";
    return;
  }

  const ppCount=hasPP?PERPLEXITY_DATA.length:0;
  const aaCount=hasAA?AA_DATA.length:0;
  document.getElementById("meta-info").textContent=`${ppCount} Perplexity models | ${aaCount} AA host endpoints | Filter by source/ranking above`;
  document.getElementById("update-date").textContent=new Date().toLocaleDateString();

  buildGroupToggles();
  document.getElementById("search").addEventListener("input",debounce(filterAndRender,200));
  document.getElementById("source-filter").addEventListener("change",filterAndRender);
  document.getElementById("size-filter").addEventListener("change",filterAndRender);
  document.getElementById("reason-filter").addEventListener("change",filterAndRender);
  document.getElementById("sort-rank").addEventListener("change",(e)=>{
    if(e.target.value){
      page=0;
      sortByRank(e.target.value);
      buildHeader();
      renderRows();
    }
  });
  document.getElementById("btn-best-resp").addEventListener("click",()=>{
    page=0;
    sortCol="avg_response_time_seconds";sortDir=1;
    document.getElementById("sort-rank").value="";
    filterAndRender();
  });
  document.getElementById("btn-reset").addEventListener("click",()=>{
    document.getElementById("search").value="";
    document.getElementById("source-filter").value="all";
    document.getElementById("size-filter").value="";
    document.getElementById("reason-filter").value="";
    document.getElementById("sort-rank").value="";
    hiddenGroups.clear();
    sortCol=null;sortDir=1;page=0;
    document.querySelectorAll(".grp-btn").forEach(b=>b.classList.remove("active"));
    filterAndRender();
  });
  filterAndRender();
}

function sortByRank(rank){
  if(rank==="intel_resp" || rank==="coding_resp" || rank==="intel_price_resp" || rank==="coding_price_resp"){
    sortCol=rank;sortDir=-1;
  }
  filterAndRender();
}

function sortByResp(){
  sortCol="avg_response_time_seconds";sortDir=1;
  filterAndRender();
}

function debounce(fn,ms){let t;return()=>{clearTimeout(t);t=setTimeout(fn,ms)}}

function buildGroupToggles(){
  const el=document.getElementById("group-toggles");if(!el)return;
  const groups=["identity","pricing","derived","quality","speed","model_meta"];
  const labels={"identity":"ID","pricing":"$","derived":"Derived","quality":"Quality","speed":"Speed","model_meta":"Meta"};
  el.innerHTML="";
  groups.forEach(g=>{
    const b=document.createElement("button");
    b.className="grp-btn";b.textContent=labels[g]||g;b.dataset.group=g;
    b.addEventListener("click",()=>{
      if(hiddenGroups.has(g)){hiddenGroups.delete(g);b.classList.remove("active")}
      else{hiddenGroups.add(g);b.classList.add("active")}
      buildHeader();renderRows();
    });
    el.appendChild(b);
  });
}

const CORE_GROUPS={identity:["host_name","model_name","base_model","model_creator_name"],pricing:["price_1m_blended_3_to_1","price_m_tokens_blended_3_to_1_per_dollar"],derived:["intel_per_resp","coding_per_resp","intel_per_price_resp","coding_per_price_resp"],quality:["model_intelligence_index","model_coding_index","model_tau2"],speed:["avg_response_time_seconds"],model_meta:["context_window","model_output_tokens","supports_web_search","reasoning_level","model_type"]};
const CORE_LABELS={"host_name":"Provider","model_name":"Model","base_model":"Base","model_creator_name":"Creator","model_type":"Type","reasoning_level":"R Level","price_1m_blended_3_to_1":"Blended $/1M","price_m_tokens_blended_3_to_1_per_dollar":"M tok/$","model_intelligence_index":"Intel","model_coding_index":"Coding","model_tau2":"tau2","supports_web_search":"Search","supports_file_upload":"Upload","context_window":"Ctx","model_output_tokens":"MaxOut","avg_response_time_seconds":"RespT(s)","intel_per_resp":"Intel/Resp","coding_per_resp":"Coding/Resp","intel_per_price_resp":"Intel/$Resp","coding_per_price_resp":"Coding/$Resp"};
const HIGHLIGHTS={"model_intelligence_index":"higher","model_coding_index":"higher","model_tau2":"higher","avg_response_time_seconds":"lower","price_1m_blended_3_to_1":"lower","intel_per_resp":"higher","coding_per_resp":"higher","intel_per_price_resp":"higher","coding_per_price_resp":"higher"};

function visibleCols(){
  const allCols=CORE_COLS||Object.keys(CORE_LABELS);
  return allCols.filter(c=>{
    const g=Object.keys(CORE_GROUPS).find(gk=>CORE_GROUPS[gk]&&CORE_GROUPS[gk].includes(c));
    return !g||!hiddenGroups.has(g);
  });
}

function colGroup(col){
  return Object.keys(CORE_GROUPS).find(g=>CORE_GROUPS[g]&&CORE_GROUPS[g].includes(col))||"";
}

function getSource(r){return r.source||r.provider||"unknown"}

function filterAndRender(){
  const q=document.getElementById("search").value.toLowerCase();
  const src=document.getElementById("source-filter").value;
  const sizeF=document.getElementById("size-filter").value;
  const reasonF=document.getElementById("reason-filter").value;

  filtered=(typeof PERPLEXITY_DATA!=="undefined"?[...PERPLEXITY_DATA]:[]).concat(typeof AA_DATA!=="undefined"?AA_DATA.slice(0,500):[]);
  filtered=filtered.filter(r=>{
    if(src!=="all"&&getSource(r)!==src)return false;
    if(sizeF&&r.model_size_class!==sizeF)return false;
    if(reasonF==="yes"&&(!r.model_reasoning_model&&r.reasoning_level!=="high"&&r.reasoning_level!=="very_high"))return false;
    if(reasonF==="no"&&(r.model_reasoning_model||r.reasoning_level==="high"||r.reasoning_level==="very_high"))return false;
    if(q){
      const h=[r.host_name,r.model_name,r.base_model,r.model_creator_name,r.model_type,r.reasoning_level].filter(Boolean).join(" ").toLowerCase();
      if(!h.includes(q))return false;
    }
    return true;
  });

  if(sortCol){
    filtered.sort((a,b)=>{
      let va=a[sortCol],vb=b[sortCol];
      if(va==null&&vb==null)return 0;if(va==null)return 1;if(vb==null)return-1;
      if(typeof va==="string")return va.localeCompare(vb)*sortDir;
      return(va-vb)*sortDir;
    });
  }
  buildHeader();renderRows();
}

function fmtNum(v,col){
  if(!v&&v!==0)return "—";
  if(col==="context_window"||col==="model_output_tokens"){
    return v>=1e6?(v/1e6|0)+"M":v>=1e3?(v/1e3|0)+"k":v+"";
  }
  if(col.includes("price")||(CORE_LABELS[col]||"").includes("$")){
    return v<0.001?v.toFixed(6):v<1?v.toFixed(4):v.toFixed(2);
  }
  if(col.includes("seconds")||col.includes("RespT"))return v.toFixed(2)+"s";
  const a=Math.abs(v);
  if(a<1)return v.toFixed(4);if(a<100)return v.toFixed(2);return v.toFixed(1);
}

function fmtBool(v){if(v===true)return"✓";if(v===false)return"✗";return""}

function buildHeader(){
  const thead=document.getElementById("thead");thead.innerHTML="";
  const tr=document.createElement("tr");
  visibleCols().forEach(col=>{
    const th=document.createElement("th");
    th.textContent=CORE_LABELS[col]||col;th.dataset.col=col;
    const g=colGroup(col);if(g)th.classList.add("gp-"+g);
    if(TXT_COLS.has(col))th.classList.add("text-col");
    if(sortCol===col)th.classList.add(sortDir===1?"asc":"desc");
    th.addEventListener("click",()=>{
      document.getElementById("sort-rank").value="";
      document.getElementById("btn-best-resp").style.background="";
      if(sortCol===col)sortDir*=-1;
      else{sortCol=col;sortDir=HIGHLIGHTS[col]==="lower"?1:-1;}
      page=0;filterAndRender();
    });
    tr.appendChild(th);
  });
  thead.appendChild(tr);
}

function renderRows(){
  const cols=visibleCols(),tbody=document.getElementById("tbody");tbody.innerHTML="";
  const start=page*PS,slice=filtered.slice(start,start+PS);
  slice.forEach(r=>{
    const tr=document.createElement("tr");
    cols.forEach(col=>{
      const td=document.createElement("td");let v=r[col];
      const g=colGroup(col);if(g)td.classList.add("gp-"+g);
      if(TXT_COLS.has(col))td.classList.add("text-col");
      if(v==null||v==="")td.textContent="—";
      else if(typeof v==="boolean")td.textContent=fmtBool(v),td.style.textAlign="center";
      else if(typeof v==="number")td.textContent=fmtNum(v,col);
      else td.textContent=v;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  const pEl=document.getElementById("paging"),total=filtered.length;
  const pages=Math.ceil(total/PS)||1;
  pEl.innerHTML='<span>'+total+' rows</span><span>Page '+(page+1)+'/'+pages+'</span><span>'+
    '<button onclick="page=Math.max(0,page-1);renderRows()">Prev</button> '+  
    '<button onclick="page=Math.min('+(pages-1)+',page+1);renderRows()">Next</button></span>';
}

init();
</script>
</body>
</html>
